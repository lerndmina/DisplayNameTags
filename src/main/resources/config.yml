options:
  threads: 2
  relative-placeholders-support: true

# Native heart bar used by the <hearts> token in a text line.
# Slot count follows the player's max-health attribute (not a fixed 10).
# Above 20 HP a second row of up to 10 hearts is added above the first;
# max health above 40 is not shown. Empty hearts fill missing current HP
# within that actual max, they do not pad up to 10 when max is lower.
hearts:
  hearts-per-row: 10
  max-rows: 2
  show-empty: true
  icons:
    full: ❤
    half: ♥
    empty: ❤
  colors:
    full: '&4'
    half: '&c'
    empty: '&7'

# Base default options applied first
defaults:
  # If not enabled then plugin simulates vanilla name tags
  # Generally only use this option if you are a developer and are
  # overwriting the vanilla implementation provided yourself.
  enabled: true
  # How often should we refresh tags (in milliseconds)
  # Do not go lower than 50ms (1 tick) or clients may be kicked.
  refresh-every: 500
  # Lines of text to display.
  #
  # Conditional segments:
  # Wrap part of a line in <ifplugin:PluginName>...</ifplugin> and it will only
  # be rendered on servers where that plugin is installed. On servers without it
  # the wrapper AND everything inside it are removed before placeholders are
  # parsed, so you never get raw '%some_placeholder%' text showing up.
  # This lets one shared config be used across a whole network. e.g
  #
  #   text:
  #     - "&b%player_ping%ms &7| &f&e%objective_score_{Deaths}%<ifplugin:PvPToggle> &7| &f%pvptoggle_icon%</ifplugin>"
  #
  # On a server with PvPToggle this renders the ping, deaths and the pvp icon.
  # On a server without it, the whole ' | %pvptoggle_icon%' segment disappears.
  #
  # Notes:
  # - The plugin name is the name it registers with the server (as shown by
  #   /plugins), and it only has to be installed, not necessarily enabled.
  # - You can use several conditionals in one line, but they cannot be nested.
  # - Anything malformed (missing closing tag, nested tags, empty name) is left
  #   in the text exactly as written, so mistakes are obvious in game.
  #
  # Hearts:
  # A line that is only <hearts> is replaced with one or two heart-bar rows
  # (see the top-level hearts: section). Put it on its own line. If you embed
  # <hearts> in other text it becomes a single compact bar instead.
  text:
    - "<white>%player_name%</white>"
    - "<hearts>"
    - "<blue>%player_ping%ms</blue>"
  # Background colour of the billboard.
  # You can use AARRGGBB hex codes e.g '#FF00FF00'
  # as well as RRGGBB hex codes e.g '#00FF00'
  # Otherwise you can use named text colours e.g 'white',
  # 'black' or 'red' as well as 'transparent'.
  background: black
  # Billboard display type.
  # You can choose 'center', 'vertical' or 'horizontal
  billboard: center
  text-shadow: true
  # Visual display range.
  # You can specify range in blocks or use 'default'
  # which will use the server's simulation distance.
  range: default
  # Gap above the head, closest to vanilla is 0.2
  gap: 0.2
  # Should the plugin remove any empty lines?
  remove-empty-lines: false
  # Controls when text should wrap to a new line
  # Higher values will allow more text before wrapping
  # Default Minecraft text display width is 200
  line-width: 200
  # Makes the text display see-through
  see-through: false
  # Controls the opacity of the text (0-255)
  text-opacity: 255
  # Fine-tune the position offset
  translate:
    x: 0.0
    y: 0.2 # Same as the gap option
    z: 0.0
  # Scale of the text display
  scale:
    x: 1.0
    y: 1.0
    z: 1.0 # Don't recommend changing this, it results in some strange results
  # Override the brightness level
  brightness: -1
  # Text shadow configuration
  shadow:
    strength: 0.5
    radius: 0.5

# Chat speech bubbles.
# When a player talks, their message is typed out character by character in a
# second text display that rides above their nametag, holds long enough to be
# read, fades and removes itself.
#
# The bubble is shown to exactly the people who can already see the player's
# nametag, and never for a sender who is in spectator, vanished, invisible or
# has had their nametag turned off by an admin. Messages that another plugin
# cancelled (mute, chat filter, blocked word) never produce a bubble.
#
# Every key below has a built-in default, so the whole section can be deleted
# and bubbles still work.
bubbles:
  enabled: true
  # Longest message shown, counted in visible characters. Longer messages are
  # cut at this point and an ellipsis is added.
  max-chars: 120
  # Height above the player. The nametag sits at 0.2 and one line of text is
  # roughly 0.25 blocks tall, so 0.6 clears a single-line tag.
  translate:
    x: 0.0
    y: 0.6
    z: 0.0
  # Same options as the defaults section above.
  billboard: center
  # Darker than the nametag background so the two read as separate things.
  background: '#60000000'
  line-width: 180
  text-shadow: true
  see-through: false
  # Overall size multiplier. The fade shrinks the bubble from this value.
  scale: 1.0
  # Visual display range in blocks, or 'default' for the server's simulation
  # distance.
  range: default
  # Typing and timing.
  style:
    # Characters revealed per tick. 2.0 is about 40 characters a second.
    chars-per-tick: 2.0
    # Extra ticks to wait after revealing a '.', '!', '?' or ellipsis.
    sentence-pause-ticks: 6
    # Extra ticks to wait after revealing a ',', ';' or ':'.
    clause-pause-ticks: 3
    # Glyph that blinks at the end of the text while typing. Leave empty for
    # no cursor.
    cursor: ▏
    # Ticks the cursor spends visible, then hidden, while typing.
    cursor-blink-ticks: 6
    # How long the finished message is held: a flat base plus an amount per
    # character, clamped between the min and max.
    hold-base-ticks: 40
    hold-per-char-ticks: 1.5
    hold-min-ticks: 40
    hold-max-ticks: 300
    # Ticks spent fading out before the bubble is removed.
    fade-ticks: 10
    # Reserved for a typing sound cue. 0 disables it; nothing plays it yet.
    sound-every-chars: 0

# Should the player see their own tag?
# This is not entirely supported, but bug reports still help
show-self: false

sneak:
  # Should we modify the opacity of the tag's background when the player shifts?
  enabled: true
  opacity: 70

# Permission based groups.
# Will only work if you have the "defaults" section enabled.
# Specify sub-groups that override the defaults.
# e.g
# groups:
#   vip:
#     background: red
#     ...
#
# Here, you would grant a user the permission "nametags.groups.vip"
# to receive a red background
groups:
  # e.g nametags.groups.vip
  vip:
    background: gray
  mvp:
    background: green
  staff:
    background: red

# Formatting.
# Select a formatter for your text, default is minimessage.
# Options:
# - minimessage
# - legacy
# - smart (Attempts to format legacy -> minimessage)
formatter: minimessage

# Extra features
# These will likely not work yet since they're experimental.
extra:
  # Should the name-tag be see-through if the player is glowing?
  glowing-feature: true

# When a tracked player is in spectator, Survival/Creative viewers cannot see
# them (or a nametag riding them). With this on, a packet player-head follows
# the spectator and the nametag rides that head instead.
# Leave off on the main network; turn it on for Arcadia realms.
spectator-visible:
  enabled: false
  # Client interpolation ticks between position updates. 1 matches a move packet.
  teleport-duration: 1
